name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Offline suite only: live checks are skipped without RUN_LIVE=1 and API keys.
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t travel-planner .
      - name: Start the container and check /health
        run: |
          docker run -d --name planner -p 8000:8000 travel-planner
          for i in $(seq 1 30); do
            if curl -sf localhost:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs planner
          exit 1
